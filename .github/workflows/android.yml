name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Import supplied source archive
        id: source
        run: |
          if [ -f source.zip ]; then
            python3 -m zipfile -e source.zip .
            chmod +x gradlew
            rm source.zip
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m 'Import complete native Android Studio project'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;36.1.0'
      - name: Test, lint and compile
        run: ./gradlew testDebugUnitTest lint assembleDebug assembleRelease bundleRelease --stacktrace
      - name: Export source history
        run: git bundle create truco-source.bundle --all
      - name: Export verified delivery through the GitHub connector
        run: |
          python3 - <<'PY'
          import base64, pathlib, tarfile
          root = pathlib.Path('.')
          with tarfile.open('/tmp/truco-delivery.tar.xz', 'w:xz') as archive:
              for pattern in ['app/build/outputs/apk/**/*.apk', 'app/build/test-results/**/*.xml', 'app/build/reports/lint-results-debug.xml', 'truco-source.bundle']:
                  for path in root.glob(pattern):
                      archive.add(path, arcname=str(path))
          data = base64.b64encode(pathlib.Path('/tmp/truco-delivery.tar.xz').read_bytes()).decode()
          print('TRUCO_DELIVERY_BEGIN')
          for offset in range(0, len(data), 8192):
              print('TRUCO_DELIVERY_DATA ' + data[offset:offset + 8192])
          print('TRUCO_DELIVERY_END')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: truco-source
          path: truco-source.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: truco-build
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            app/build/outputs/mapping/release/
            app/build/reports/
  device-tests:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;36.1.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop io.github.vontk.truco.debug
            adb shell am start -n io.github.vontk.truco.debug/io.github.vontk.truco.MainActivity
            sleep 2
            adb exec-out screencap -p > screenshots/light.png
            adb shell cmd uimode night yes
            sleep 2
            adb exec-out screencap -p > screenshots/dark.png
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb shell settings put system font_scale 1.5
            sleep 2
            adb exec-out screencap -p > screenshots/landscape-large-font.png
            adb shell settings put system user_rotation 0
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night auto
            echo TRUCO_LIGHT_BEGIN
            base64 -w8192 screenshots/light.png
            echo TRUCO_LIGHT_END
            echo TRUCO_DARK_BEGIN
            base64 -w8192 screenshots/dark.png
            echo TRUCO_DARK_END
            echo TRUCO_LANDSCAPE_BEGIN
            base64 -w8192 screenshots/landscape-large-font.png
            echo TRUCO_LANDSCAPE_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            screenshots/
