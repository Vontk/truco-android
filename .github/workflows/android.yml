name: Android
on:
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', '*.kts', 'gradle.properties', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;36.1.0'
      - name: Test, lint and compile
        run: ./gradlew testDebugUnitTest lint assembleDebug assembleRelease bundleRelease --stacktrace
      - name: Export source history
        run: git bundle create truco-source.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: truco-source
          path: truco-source.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: truco-build
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            app/build/outputs/mapping/release/
            app/build/reports/
  device-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;36.1.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop io.github.vontk.truco.debug
            adb shell am start -n io.github.vontk.truco.debug/io.github.vontk.truco.MainActivity
            sleep 8
            adb exec-out screencap -p > screenshots/light.png
            adb shell cmd uimode night yes
            sleep 2
            adb exec-out screencap -p > screenshots/dark.png
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb shell settings put system font_scale 1.5
            sleep 2
            adb exec-out screencap -p > screenshots/landscape-large-font.png
            adb shell settings put system user_rotation 0
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night auto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            screenshots/
