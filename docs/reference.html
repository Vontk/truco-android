<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e9e7ef">
  <meta name="description" content="Contador de Truco argentino, minimalista y sin conexión.">
  <title>Truco</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Roboto, "Google Sans", "Segoe UI", system-ui, sans-serif;
      font-synthesis: none;
      -webkit-tap-highlight-color: transparent;
      --bg: #e9e7ef;
      --text: #1d1c22;
      --subtle: #73717c;
      --divider: #c4c1cb;
      --tally: #494653;
      --ghost: #cfccd6;
      --press: rgba(50, 48, 59, .075);
      --dialog: #f4f2fa;
      --dialog-chip: #e8e5ef;
      --primary: #494653;
      --on-primary: #fff;
      --overlay: rgba(15, 14, 20, .5);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #101016;
      --text: #eeedf4;
      --subtle: #aaa8b3;
      --divider: #474550;
      --tally: #d5d1df;
      --ghost: #2c2a35;
      --press: rgba(220, 214, 235, .07);
      --dialog: #24232b;
      --dialog-chip: #37343e;
      --primary: #d5d1df;
      --on-primary: #282630;
      --overlay: rgba(0, 0, 0, .62);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, [role="button"]:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: -4px;
      z-index: 2;
    }
    .app {
      width: 100%;
      height: 100svh;
      height: 100dvh;
      background: var(--bg);
      display: grid;
      grid-template-rows: calc(32px + env(safe-area-inset-top, 0px)) 67px minmax(0, 1fr) calc(26px + env(safe-area-inset-bottom, 0px));
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }
    /* Mock system UI for this standalone HTML prototype. */
    .statusbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      padding: env(safe-area-inset-top, 0px) 25px 3px;
      font-size: 14px;
      font-weight: 680;
      letter-spacing: .1px;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }
    .status-icons { display: flex; align-items: center; gap: 6px; height: 18px; }
    .status-icons svg { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .status-icons .battery { width: 23px; height: 17px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 17px 0 23px;
      min-height: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; user-select: none; }
    .brand-mark { width: 28px; height: 28px; color: var(--text); display: grid; place-items: center; }
    .brand-mark svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    .brand-name { font-size: 23px; font-weight: 740; letter-spacing: -1.25px; }
    .toolbar { display: flex; align-items: center; gap: 3px; }
    .icon-button {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 23px;
      background: transparent;
      color: var(--text);
      display: grid;
      place-items: center;
      transition: background-color 120ms ease;
    }
    .icon-button svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .icon-button:hover, .icon-button:active { background: var(--press); }
    .board {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      min-height: 0;
      background: var(--bg);
    }
    .zone {
      position: relative;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(12px, 2.2dvh, 21px) 6px 4px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      cursor: pointer;
      overflow: hidden;
      background: transparent;
      transition: background-color .11s ease;
    }
    .zone[data-team="nos"] { border-right: 1px solid var(--divider); }
    .zone[data-phase="bad"] { border-bottom: 1px solid var(--divider); }
    .zone:active { background: var(--press); }
    .zone-head { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; }
    .team-name { font-size: 16px; font-weight: 640; letter-spacing: -.2px; line-height: 1.35; }
    .score {
      font-size: clamp(48px, 7.1dvh, 65px);
      font-weight: 730;
      letter-spacing: -3px;
      line-height: 1.07;
      font-variant-numeric: tabular-nums;
    }
    .tallies {
      width: 100%;
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(5px, .9dvh, 11px);
      padding-top: clamp(11px, 1.75dvh, 17px);
      pointer-events: none;
    }
    .zone[data-phase="good"] .tallies { padding-top: clamp(21px, 4dvh, 39px); }
    .tally {
      width: clamp(34px, 7.35dvh, 68px);
      height: clamp(34px, 7.35dvh, 68px);
      flex: 0 1 auto;
      overflow: visible;
      display: block;
      color: var(--tally);
    }
    .tally path { stroke: currentColor; stroke-width: 5.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .tally .guide { color: var(--ghost); }
    .navbar { display: grid; place-items: center; background: var(--bg); }
    .gesture-bar { width: 108px; height: 4px; border-radius: 999px; background: var(--text); opacity: .9; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    dialog {
      color: var(--text);
      background: var(--dialog);
      border: none;
      font: inherit;
      box-shadow: 0 18px 70px rgba(0,0,0,.22);
    }
    dialog::backdrop { background: var(--overlay); backdrop-filter: blur(3px); }
    .confirm-dialog { width: min(365px, calc(100vw - 36px)); border-radius: 28px; padding: 28px 25px 23px; }
    .confirm-dialog h2 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.7px; }
    .confirm-dialog p { color: var(--subtle); margin: 13px 0 26px; font-size: 14px; line-height: 1.55; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn { border: none; border-radius: 100px; min-height: 46px; padding: 0 18px; font-size: 14px; font-weight: 650; }
    .btn.quiet { background: var(--dialog-chip); color: var(--text); }
    .btn.primary { background: var(--primary); color: var(--on-primary); }
    .toast {
      position: absolute;
      bottom: calc(46px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translate(-50%, 12px);
      z-index: 4;
      padding: 11px 16px;
      border-radius: 12px;
      background: var(--text);
      color: var(--bg);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s, transform .18s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (min-width: 600px) {
      body { background: #ccc9d2; }
      :root[data-theme="dark"] body { background: #050507; }
      .app {
        width: min(430px, calc((100dvh - 36px) * 9 / 19.5));
        height: min(calc(100dvh - 36px), 932px);
        aspect-ratio: 9 / 19.5;
        border-radius: 35px;
        box-shadow: 0 22px 65px rgba(0, 0, 0, .18), 0 0 0 1px rgba(0,0,0,.12);
      }
    }
    @media (max-height: 690px) {
      .app { grid-template-rows: calc(27px + env(safe-area-inset-top, 0px)) 54px minmax(0, 1fr) calc(21px + env(safe-area-inset-bottom, 0px)); }
      .zone { padding-top: 9px; }
      .team-name { font-size: 14px; }
      .score { font-size: clamp(39px, 7dvh, 51px); }
      .tallies { padding-top: 6px; gap: 4px; }
      .zone[data-phase="good"] .tallies { padding-top: 16px; }
      .tally { width: clamp(30px, 7dvh, 49px); height: clamp(30px, 7dvh, 49px); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="statusbar" aria-label="Barra de estado de Android, ilustrativa">
      <span id="clock" aria-label="Hora">9:41</span>
      <span class="status-icons" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 18V21H6V18M8 14V21H11V14M13 10V21H16V10M18 5V21H21V5" fill="currentColor" stroke="none"/></svg>
        <svg viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 18 0M6.5 12.5a9 9 0 0 1 11 0M10.5 16a3.8 3.8 0 0 1 3 0"/><circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none"/></svg>
        <svg class="battery" viewBox="0 0 29 20"><rect x="1.4" y="3.3" width="23" height="13.4" rx="3"/><path d="M26.1 7.3v5.4"/><rect x="4.2" y="6.1" width="16.5" height="7.8" rx="1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>

    <header class="topbar">
      <div class="brand" aria-label="Truco">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 20 20 4"/></svg></span>
        <span class="brand-name">truco</span>
      </div>
      <div class="toolbar">
        <button type="button" class="icon-button" id="resetButton" aria-label="Nuevo partido" title="Nuevo partido">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.4 6.1M3 4v7h7"/></svg>
        </button>
      </div>
    </header>

    <main class="board" id="board" aria-label="Tablero de Truco: tocar arriba para restar, abajo para sumar">
      <section class="zone" data-team="nos" data-phase="bad" data-delta="-1" role="button" tabindex="0" aria-label="Nosotros, restar un punto">
        <div class="zone-head"><span class="team-name">Nosotros</span><span class="score" id="nosScore">0</span></div>
        <div class="tallies" id="nosBad" aria-hidden="true"></div>
      </section>
      <section class="zone" data-team="ellos" data-phase="bad" data-delta="-1" role="button" tabindex="0" aria-label="Ellos, restar un punto">
        <div class="zone-head"><span class="team-name">Ellos</span><span class="score" id="ellosScore">0</span></div>
        <div class="tallies" id="ellosBad" aria-hidden="true"></div>
      </section>
      <section class="zone" data-team="nos" data-phase="good" data-delta="1" role="button" tabindex="0" aria-label="Nosotros, sumar un punto">
        <div class="tallies" id="nosGood" aria-hidden="true"></div>
      </section>
      <section class="zone" data-team="ellos" data-phase="good" data-delta="1" role="button" tabindex="0" aria-label="Ellos, sumar un punto">
        <div class="tallies" id="ellosGood" aria-hidden="true"></div>
      </section>
    </main>
    <div class="navbar" aria-hidden="true"><span class="gesture-bar"></span></div>
    <span class="sr-only" role="status" id="gameStatus" aria-live="polite"></span>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <dialog class="confirm-dialog" id="resetDialog" aria-labelledby="resetTitle">
    <h2 id="resetTitle">¿Nuevo partido?</h2>
    <p>Los puntos de ambos equipos volverán a cero. Esta acción no se puede deshacer.</p>
    <div class="dialog-actions">
      <button class="btn quiet" type="button" id="cancelReset">Cancelar</button>
      <button class="btn primary" type="button" id="confirmReset">Empezar de nuevo</button>
    </div>
  </dialog>

  <script>
    (() => {
      'use strict';
      // Same storage key as the previous prototype: keeps any existing scores.
      const STORAGE_KEY = 'truco-counter-material-v1';
      const clampScore = n => Number.isInteger(n) ? Math.max(0, Math.min(30, n)) : 0;
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; } catch (_) { /* Storage unavailable. */ }
      const state = {
        nos: clampScore(saved.nos),
        ellos: clampScore(saved.ellos)
      };
      const $ = id => document.getElementById(id);
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const resetDialog = $('resetDialog');
      const paths = [
        'M13 12H51', 'M51 12V50', 'M51 50H13', 'M13 50V12', 'M13 50L51 12'
      ];
      let toastTimer;
      const persist = () => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) { /* Storage unavailable. */ }
      };
      function tallyMarkup(count) {
        return [0, 1, 2].map(i => {
          const n = Math.max(0, Math.min(5, count - i * 5));
          return `<svg class="tally" viewBox="0 0 64 64" focusable="false" aria-hidden="true"><g class="guide">${paths.map(d => `<path d="${d}"/>`).join('')}</g>${paths.slice(0, n).map(d => `<path d="${d}"/>`).join('')}</svg>`;
        }).join('');
      }
      function render() {
        for (const team of ['nos', 'ellos']) {
          const n = state[team];
          $(team + 'Score').textContent = String(n);
          $(team + 'Bad').innerHTML = tallyMarkup(Math.min(15, n));
          $(team + 'Good').innerHTML = tallyMarkup(Math.max(0, n - 15));
          const label = team === 'nos' ? 'Nosotros' : 'Ellos';
          for (const zone of document.querySelectorAll(`.zone[data-team="${team}"]`)) {
            zone.setAttribute('aria-label', `${label}: ${n} puntos. ${zone.dataset.phase === 'bad' ? 'Restar' : 'Sumar'} un punto`);
          }
        }
        $('gameStatus').textContent = state.nos === 30 ? 'Nosotros llegaron a 30 puntos' : state.ellos === 30 ? 'Ellos llegaron a 30 puntos' : '';
      }
      function toast(text) {
        const el = $('toast');
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 1700);
      }
      function score(team, delta) {
        const before = state[team];
        const next = clampScore(before + delta);
        if (before === next) return;
        state[team] = next;
        persist();
        render();
        if (navigator.vibrate) navigator.vibrate(7);
        if (next === 30) toast(team === 'nos' ? '¡Ganamos!' : '¡Ganaron ellos!');
      }
      for (const zone of document.querySelectorAll('.zone')) {
        const activate = () => score(zone.dataset.team, Number(zone.dataset.delta));
        zone.addEventListener('click', activate);
        zone.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault(); activate();
          }
        });
      }
      $('resetButton').addEventListener('click', () => resetDialog.showModal());
      $('cancelReset').addEventListener('click', () => resetDialog.close());
      $('confirmReset').addEventListener('click', () => {
        state.nos = state.ellos = 0;
        persist(); render(); resetDialog.close(); toast('Nuevo partido iniciado');
      });
      function applyTheme() {
        const theme = media.matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101016' : '#e9e7ef';
      }
      media.addEventListener('change', applyTheme);
      resetDialog.addEventListener('click', event => { if (event.target === resetDialog) resetDialog.close(); });
      // HTML mock of the Android system clock (icons are illustrative).
      function updateClock() {
        $('clock').textContent = new Intl.DateTimeFormat('es-AR', { hour: 'numeric', minute: '2-digit', hour12: false }).format(new Date());
      }
      updateClock();
      setInterval(updateClock, 30_000);
      applyTheme();
      render();
    })();
  </script>
</body>
</html>
